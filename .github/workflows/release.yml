# publish-contract: go-binary-v1
name: Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to recover (empty uses the dispatch tag)
        type: string
        default: ""
      bottles:
        description: Build and publish macOS Homebrew bottles
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ferri-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  release:
    outputs:
      source: ${{ steps.validate.outputs.source }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Validate remote annotated tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "Error: $*" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Invalid release tag: $RELEASE_TAG"
          [[ "$RELEASE_TAG" == "v$(cat VERSION.txt)" ]] || fail "Tag does not match VERSION.txt"
          # Checkout may map the peeled commit to a local tag. Inspect a separate remote ref.
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/ferri-release/tag"
          [[ "$(git cat-file -t refs/ferri-release/tag)" == tag ]] || fail "Remote release tag must be annotated"
          source=$(git rev-parse 'refs/ferri-release/tag^{commit}')
          [[ "$source" == "$(git rev-parse HEAD)" ]] || fail "Remote tag does not match checked-out source"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Build deterministic binaries
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go run ./scripts/release
          git diff --exit-code -- Formula/ferri.rb
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" bash scripts/release-assets.sh dist/ferri_* dist/SHA256SUMS THIRD-PARTY-NOTICES.md
  bottles:
    needs: release
    if: inputs.bottles
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.source }}
      - name: Build and test bottles from released binaries
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: GITHUB_REF_NAME="$RELEASE_TAG" bash scripts/release-bottles.sh build
      - uses: actions/upload-artifact@v6
        with:
          name: bottles-${{ matrix.os }}
          path: bottle-output/*
          if-no-files-found: error
  publish-bottles:
    needs: [release, bottles]
    if: inputs.bottles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.source }}
      - uses: actions/download-artifact@v7
        with:
          pattern: bottles-*
          merge-multiple: true
          path: bottle-output
      - name: Validate and upload immutable bottles
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" bash scripts/release-bottles.sh publish
      - name: Commit only the verified bottle Formula
        shell: bash
        env:
          RELEASE_SOURCE: ${{ needs.release.outputs.source }}
        run: |
          set -euo pipefail
          cp Formula/ferri.rb "$RUNNER_TEMP/ferri-bottle.rb"
          git restore Formula/ferri.rb
          git fetch origin master
          source=$RELEASE_SOURCE
          changes=$(git diff --name-only "$source" origin/master)
          while IFS= read -r path; do
            case "$path" in
              ""|Formula/ferri.rb|.github/workflows/release.yml|RELEASING.md|tests/release_tag_test.sh) ;;
              .gitignore|.idea/*|README.md|README-EN.md) ;;
              scripts/merge-bottles.rb|tests/bottle_metadata_test.rb) ;;
              *) echo "Source changed since release: $path" >&2; exit 1 ;;
            esac
          done <<< "$changes"
          git show "$source:Formula/ferri.rb" | sed '/^  bottle do$/,/^  end$/d; /^[[:space:]]*$/d' > "$RUNNER_TEMP/source-formula"
          git show origin/master:Formula/ferri.rb | sed '/^  bottle do$/,/^  end$/d; /^[[:space:]]*$/d' > "$RUNNER_TEMP/master-formula"
          cmp "$RUNNER_TEMP/source-formula" "$RUNNER_TEMP/master-formula"
          git checkout -B master origin/master
          cp "$RUNNER_TEMP/ferri-bottle.rb" Formula/ferri.rb
          if git diff --quiet -- Formula/ferri.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ferri.rb
          git commit -m "Publish Ferri $RELEASE_TAG macOS bottles"
          git push origin HEAD:refs/heads/master
