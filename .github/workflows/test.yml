name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Unix installer and completion
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go build -o bin/ferrie .
          bash -n install.sh
          bash -n scripts/release-assets.sh
          bash -n scripts/release-bottles.sh
          ruby tests/bottle_metadata_test.rb
          bash tests/completion_test.sh
          bash tests/installer_test.sh
          FERRIE_INSTALL_DIR="$RUNNER_TEMP/ferrie bin" FERRIE_DATA_DIR="$RUNNER_TEMP/ferrie share" bash install.sh --local
          "$RUNNER_TEMP/ferrie bin/ferrie" --version
      - name: Windows installer and completion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o bin/ferrie.exe .
          ./tests/windows_test.ps1
  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install prebuilt formula with no runtime dependencies
        run: |
          go run ./scripts/release
          brew tap-new --no-git ferrie/local
          ruby -e 'text = File.read("Formula/ferrie.rb"); text.gsub!(%r{https://github.com/leo1394/homebrew-ferrie/releases/download/v[^/]+/}, "file://#{Dir.pwd}/dist/"); File.write(ARGV[0], text)' "$(brew --repository ferrie/local)/Formula/ferrie.rb"
          if brew commands | grep -qx trust; then brew trust --formula ferrie/local/ferrie; fi
          brew install ferrie/local/ferrie
          brew test ferrie/local/ferrie
